<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://maximerey.framer.website/">
    <title>Redirecting to Maxime Rey...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #ededed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            padding: 2rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.95rem;
            color: #888888;
            margin-bottom: 1.5rem;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            transition: border-color 0.2s ease;
            padding-bottom: 2px;
        }
        a:hover {
            border-color: #ffffff;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Instant redirect backup
        window.location.href = "https://maximerey.framer.website/";
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Taking you to the new website!</h1>
        <p><a href="https://maximerey.framer.website/">Click here</a> if you are not redirected automatically.</p>
    </div>
</body>
</html>
